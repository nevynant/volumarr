# Volumarr -- working compose file.
#
# This is a real, running configuration rather than a sanitised sample; the
# paths below are the author's. See docker-compose.example.yml for a version
# with placeholders. Adjust the four host paths and the icon URL to suit your
# own setup.
#
# Notes that apply to any deployment:
#
# - Host port 8990 avoids colliding with Sonarr's own 8989, which matters if
#   you run both on one machine.
#
# - Mount your audiobook library here, in the compose file itself, so it
#   survives `docker compose up -d` recreating the container. A mount added
#   out-of-band (e.g. via a GUI) is silently dropped on the next rebuild.
#
# - /downloads must resolve to the same files your download client sees, at
#   the same container path it uses. Without that overlap a completed grab is
#   invisible to Volumarr and will never import.
name: volumarr-sonarr
services:
  volumarr-sonarr:
    build: .
    container_name: volumarr-sonarr
    restart: unless-stopped
    ports:
      - "8990:8989"
    volumes:
      - /DATA/AppData/volumarr-sonarr/config:/config
      - /DATA/AppData/volumarr-sonarr/test-library:/test-library
      - /media/Main-Storage/Media/Audiobooks:/Audiobooks
      - /DATA/Downloads:/downloads

# CasaOS / ZimaOS dashboard card metadata. Read directly from this compose
# file -- no App Store submission needed -- and must sit at root level per
# CasaOS's schema (a sibling of `services`, not nested inside one). Harmless
# on other platforms; delete it if you don't use CasaOS.
#
# The icon URL just has to be reachable from the CasaOS host, so it points at
# the app's own favicon rather than anywhere external. Replace the address
# with wherever you run Volumarr.
x-casaos:
  architectures:
    - amd64
    - arm64
  main: volumarr-sonarr
  title:
    en_us: Volumarr
  description:
    en_us: Audiobook series tracker and downloader -- a Sonarr fork that
      watches your Audible series and grabs new books as they release.
  tagline:
    en_us: Sonarr, but for audiobook series
  icon: http://192.168.1.111:8990/Content/Images/Icons/android-chrome-512x512.png
  category: Media
  port_map: "8990"
  scheme: http
  index: /
